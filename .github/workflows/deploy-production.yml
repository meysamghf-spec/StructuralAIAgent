name: SAIA production deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saia-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.SAIA_SSH_HOST }}
          SSH_USER: ${{ secrets.SAIA_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SAIA_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_HOST" || { echo "::error::Missing SAIA_SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::Missing SAIA_SSH_USER"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing SAIA_SSH_PRIVATE_KEY"; exit 1; }

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SAIA_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/saia_deploy
          chmod 600 ~/.ssh/saia_deploy

      - name: Verify and trust server host key
        env:
          SSH_HOST: ${{ secrets.SAIA_SSH_HOST }}
          SSH_PORT: ${{ secrets.SAIA_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          EXPECTED_FINGERPRINT="SHA256:VU972JSyeu7dmu10v0o8kngzCRcLOsHTbMkNlS3RhoA"
          HOST_KEYS="$(mktemp)"
          trap 'rm -f "$HOST_KEYS"' EXIT
          ssh-keyscan -T 10 -p "$PORT" -t ed25519 "$SSH_HOST" > "$HOST_KEYS" 2>/dev/null
          test -s "$HOST_KEYS" || { echo "::error::Could not retrieve the server ED25519 host key"; exit 1; }
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$HOST_KEYS" | awk 'NR == 1 {print $2}')"
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT" || {
            echo "::error::Server host key fingerprint did not match the verified ArvanCloud fingerprint"
            exit 1
          }
          install -m 600 "$HOST_KEYS" ~/.ssh/known_hosts

      - name: Transfer application source
        env:
          SSH_HOST: ${{ secrets.SAIA_SSH_HOST }}
          SSH_USER: ${{ secrets.SAIA_SSH_USER }}
          SSH_PORT: ${{ secrets.SAIA_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./.env.production' \
            --exclude='./backups' \
            -czf - . |
            ssh -i ~/.ssh/saia_deploy -p "$PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              'mkdir -p /opt/sazeh && tar -xzf - -C /opt/sazeh'

      - name: Initialize and deploy application
        env:
          SSH_HOST: ${{ secrets.SAIA_SSH_HOST }}
          SSH_USER: ${{ secrets.SAIA_SSH_USER }}
          SSH_PORT: ${{ secrets.SAIA_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/saia_deploy -p "$PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io docker-compose-v2
            systemctl enable --now docker
          elif ! docker compose version >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker-compose-v2
          fi

          cd /opt/sazeh
          test -f .env.production.example
          test -f docker-compose.prod.yml

          if [ ! -f .env.production ]; then
            cp .env.production.example .env.production
            DB_PASSWORD="$(openssl rand -hex 24)"
            JWT_SECRET="$(openssl rand -hex 48)"
            sed -i 's|^DOMAIN=.*|DOMAIN=structuralai.ir|' .env.production
            sed -i 's|^CORS_ORIGINS=.*|CORS_ORIGINS=https://structuralai.ir|' .env.production
            sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$DB_PASSWORD|" .env.production
            sed -i "s|^AUTH_JWT_SECRET=.*|AUTH_JWT_SECRET=$JWT_SECRET|" .env.production
          fi
          chmod 600 .env.production
          if grep -Eq '^(DOMAIN|POSTGRES_PASSWORD|AUTH_JWT_SECRET)=(app\.example\.ir|change-me)' .env.production; then
            echo "Production configuration still contains example values; refusing deployment."
            exit 1
          fi

          docker compose --env-file .env.production -f docker-compose.prod.yml config -q
          if [ -n "$(docker compose --env-file .env.production -f docker-compose.prod.yml ps -q db)" ]; then
            bash deploy/backup.sh
          fi
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
          docker compose --env-file .env.production -f docker-compose.prod.yml ps
          REMOTE

      - name: Verify deployed services
        env:
          SSH_HOST: ${{ secrets.SAIA_SSH_HOST }}
          SSH_USER: ${{ secrets.SAIA_SSH_USER }}
          SSH_PORT: ${{ secrets.SAIA_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/saia_deploy -p "$PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/sazeh
          COMPOSE="docker compose --env-file .env.production -f docker-compose.prod.yml"
          $COMPOSE exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"
          $COMPOSE exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=10)"
          $COMPOSE exec -T frontend node -e "fetch('http://127.0.0.1:3000/workspace/model').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
          $COMPOSE exec -T frontend node <<'NODE'
          (async () => {
            const origin = "http://127.0.0.1:3000";
            const page = await fetch(origin + "/workspace/model");
            if (!page.ok) throw new Error("Frontend page returned " + page.status);
            const html = await page.text();
            const hrefs = [...html.matchAll(/href="([^"]+\\.css[^"]*)"/g)].map((match) => match[1]);
            const href = hrefs.find((value) => value.includes("/_next/static/css/"));
            if (!href) throw new Error("No Next.js stylesheet linked by the live page");
            const response = await fetch(new URL(href, origin));
            if (!response.ok) throw new Error("Stylesheet returned " + response.status);
            const css = await response.text();
            if (!css.includes("width:44px") || !css.includes(".content .an-kpis")) {
              throw new Error("Live page stylesheet is missing the mobile layout rules");
            }
            console.log("Verified live stylesheet: " + href + " (mobile rules present)");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          REMOTE
