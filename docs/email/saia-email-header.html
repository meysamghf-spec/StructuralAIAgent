<!-- SAIA email header. Table-based, inline styles (works in Gmail/Outlook).
     Rules: never print the domain/URL as visible text; use the button label "Try SAIA".
     Host saia-mark.png at an absolute URL (or embed as CID) and replace {{LOGO_URL}}.
     Use {{CTA_URL}} only as an href, never as visible text. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0f172a;">
  <tr>
    <td align="center" style="padding:0;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">
        <tr>
          <td style="padding:28px 24px 18px 24px;background:#0f172a;background-image:linear-gradient(120deg,#1e1b4b 0%,#0f172a 55%,#083344 100%);">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td valign="middle" style="padding-right:14px;">
                  <img src="{{LOGO_URL}}" width="48" height="48" alt="SAIA" style="display:block;border:0;border-radius:12px;">
                </td>
                <td valign="middle" style="font-family:'Segoe UI',Arial,sans-serif;">
                  <div style="font-size:28px;line-height:30px;font-weight:800;letter-spacing:5px;color:#7dd3fc;">SAIA</div>
                  <div style="font-size:11px;line-height:16px;letter-spacing:.5px;color:#94a3b8;">AI for structural engineering</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr><td style="height:3px;line-height:3px;font-size:0;background:#38bdf8;background-image:linear-gradient(90deg,#6366f1,#0ea5e9,#22d3ee);">&nbsp;</td></tr>
      </table>
    </td>
  </tr>
</table>
